<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - BloodConnect</title>
    <link rel="stylesheet" href="bloodbank.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">BloodConnect</div>
        <ul>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>

    <h1 class="main-heading"> BloodConnect</h1>

    <div class="form-container">
        <form action="process_registration.php" method="POST">
            
            <div class="form-group">
                <label>Full Name / Hospital Name</label>
                <input type="text" name="fullname" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Create a password" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone" placeholder="03xxxxxxxxx" required>
            </div>

            <div class="form-group">
                <label>Register As (Role)</label>
                <select name="role" required>
                    <option value="Donor">Donor</option>
                    <option value="Acceptor">Acceptor</option>
                    <option value="Hospital">Hospital / Medical Center </option>
                    <!-- No Admin option here for security! -->
                </select>
            </div>

            <div class="form-group">
                <label>Blood Group</label>
                <select name="blood_group" required>
                    <option value="">Select Group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
            </div>

            <div style="text-align: center;">
                <button type="submit" name="register_submit">Register Now</button>
            </div>
        </form>

        <p class="login-link">
            Already Have An Account? <a href="login.html">Login</a>
        </p>
    </div>
</body>
</html>
