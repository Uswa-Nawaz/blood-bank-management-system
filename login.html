<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - BloodConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="bloodbank.css" />    
</head>
<body>
    
<nav class="navbar">
    <div class="logo">BloodConnect</div>
    <ul>
        <li><a href="register.html">Register Now</a></li>
    </ul>
</nav>

<h1 class="main-heading">Login</h1>

<main>
    <div class="form-container" style="max-width: 400px; padding-top: 50px">
        <!-- Changed action to point to our PHP file and method to POST -->
        <form action="process_login.php" method="POST" class="card" style="padding: 30px">
            <div>
                <label>Full Name</label>
                <input type="text" name="fullname" placeholder="Enter your name" required>
            </div>
            <br>
            <div>
                <label>Password:</label>
                <input type="password" name="password" required>
            </div>
            <br>
            <div>
                <label for="role">Login As</label>
                <select id="role" name="role" required>
                    <option value="Donor">Donor</option>
                    <option value="Acceptor">Acceptor</option>
                    <option value="Admin">Admin</option> <!-- Added this -->
                </select>
            </div>
            <br>
            <button type="submit" name="login_submit">Login</button>
        </form>

        <p class="login-link">
            Don't Have An Account? 
            <a href="register.html">Signup</a>
        </p>
    </div>
</main>

</body>
</html>
