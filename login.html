<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - BloodConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="bloodbank.css" />    
</head>
<body>
    
<nav class="navbar">
    <div class="logo">BloodConnect</div>
    <ul>
        <li><a href="register.html">Register Now</a></li>
    </ul>
</nav>

<h1 class="main-heading">Login</h1>

<main>
    <div class="form-container">
        <form action="process_login.php" method="POST">
            <div class="form-group">
                <label>Full Name / Corporate Name</label>
                <input type="text" name="fullname" placeholder="Enter your registered name" required>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>
            
            <div class="form-group">
                <label for="role">Login As</label>
                <select id="role" name="role" required>
                    <option value="Donor">Donor</option>
                    <option value="Acceptor">Acceptor</option>
                    <option value="Hospital">Hospital / Center</option> <option value="Admin">Admin</option> 
                </select>
            </div>
            
            <div style="text-align: center;">
                <button type="submit" name="login_submit" class="submit-btn">Login</button>
            </div>
        </form>

        <p class="login-link">
            Don't Have An Account? 
            <a href="register.html">Signup</a>
        </p>
    </div>
</main>

</body>
</html>
